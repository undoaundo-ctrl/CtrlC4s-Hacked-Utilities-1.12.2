name: Build CtrlC4's Hacked Utilities (1.12.2)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assemble --no-daemon --stacktrace
      - name: Collect jars
        run: |
          mkdir -p out
          cp build/libs/*.jar out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: CtrlC4s-Hacked-Utilities-1.12.2
          path: out/*.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CtrlC4's Hacked Utilities 1.12.2 build ${{ github.run_number }}
          files: out/*.jar
